name: Keep Render API Awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-api-awake
  cancel-in-progress: true

jobs:
  ping-health-endpoint:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping badminton API health endpoint
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --retry-delay 5 \
            --max-time 90 \
            https://badminton-tracker-qhj6.onrender.com/api/health
